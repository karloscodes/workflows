name: CI

# Every repo calls these workflows at main, so a commit here reaches all of them on
# their next run. This runs on every branch: test a change on one before it merges.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # SC2015 flags `a && b || c`: each of these scripts means it.
      - name: Lint the workflows
        run: |
          curl -sSfLO https://github.com/rhysd/actionlint/releases/download/v1.7.11/actionlint_1.7.11_linux_amd64.tar.gz
          echo "900919a84f2229bac68ca9cd4103ea297abc35e9689ebb842c6e34a3d1b01b0a  actionlint_1.7.11_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf actionlint_1.7.11_linux_amd64.tar.gz actionlint
          ./actionlint -ignore SC2015

  gitleaks:
    uses: ./.github/workflows/gitleaks.yml

  test:
    name: test
    if: always()
    needs: [actionlint, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - run: |
          ! grep -qE "failure|cancelled" <<<"${{ join(needs.*.result, ' ') }}"
