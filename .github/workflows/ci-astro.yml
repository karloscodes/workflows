name: CI for a site

# The CI of an Astro site. Netlify (Chasen for chasenhq.com) still builds and
# deploys it; this lets merge-security-updates.yml merge a Dependabot update only
# when the site builds. Node 22, like the Netlify builds.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: npm run build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  gitleaks:
    uses: ./.github/workflows/gitleaks.yml

  # It passes when every job above passed.
  test:
    name: test
    if: always()
    needs: [build, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - run: |
          ! grep -qE "failure|cancelled" <<<"${{ join(needs.*.result, ' ') }}"
